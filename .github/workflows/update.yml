name: Update Gold & USD Tracker

on:
  schedule:
    # هر روز ساعت ۱۹:۰۰ به وقت تهران (ایران دیگه DST نداره، ثابت UTC+3:30 هست)
    - cron: "30 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest prices & update history
        run: python scripts/update.py

      - name: Commit & push if changed
        run: |
          git config user.name "gold-usd-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: update rates for $(date -u +'%Y-%m-%d')"
          git push
